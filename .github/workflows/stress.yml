name: TCP stress

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Minimum duration after warmup (seconds)'
        type: choice
        required: true
        default: '60'
        options:
          - '60'
          - '600'
          - '3600'
          - '7200'
  push:
    paths:
      - 'src/**'
      - 'tests/Stress/**'
      - 'tests/Support/echo-server.php'
      - 'composer.json'
      - '.github/workflows/stress.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Stress/**'
      - 'tests/Support/echo-server.php'
      - 'composer.json'
      - '.github/workflows/stress.yml'

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds == '7200' && 130 || github.event_name == 'workflow_dispatch' && inputs.seconds == '3600' && 70 || github.event_name == 'workflow_dispatch' && inputs.seconds == '600' && 18 || 8 }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Exercise sustained loopback sessions and churn
        shell: bash
        env:
          STRESS_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || '60' }}
        run: |
          set -euo pipefail
          case "$STRESS_SECONDS" in
            60|600|3600|7200) ;;
            *) exit 2 ;;
          esac
          python3 tests/Stress/run.py --seconds="$STRESS_SECONDS" | tee "$RUNNER_TEMP/stress.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-php-${{ matrix.php }}
          path: ${{ runner.temp }}/stress.json
          if-no-files-found: error
