name: Comparative performance

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Additional recent commit to compare hot paths against (full SHA)'
        required: false
        default: '1f482c9f30e2cd18814ceabed6f7996023b9721a'
  push:
    paths:
      - 'src/**'
      - 'composer.json'
      - 'phpbench.json.dist'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

concurrency:
  group: phpbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install shared dependencies
        env:
          CHECKPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint || '1f482c9f30e2cd18814ceabed6f7996023b9721a' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/baseline" 2e547491d07bd0840dd0bff674b35c145fd0acc6
          [[ "$CHECKPOINT" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/checkpoint" "$CHECKPOINT"
          composer install --no-interaction --prefer-dist
      - name: Run PHPBench baseline and current revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/performance"
          export WEBSOCKET_BENCH_SOURCE="$RUNNER_TEMP/baseline/src"
          php -r 'require "benchmarks/bootstrap.php"; echo (new ReflectionClass(Componenta\WebSocket\Protocol\FrameCodec::class))->getFileName(), PHP_EOL;'
          vendor/bin/phpbench run --group=comparative --tag=baseline --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/baseline.txt"
          export WEBSOCKET_BENCH_SOURCE="$PWD/src"
          php -r 'require "benchmarks/bootstrap.php"; echo (new ReflectionClass(Componenta\WebSocket\Protocol\FrameCodec::class))->getFileName(), PHP_EOL;'
          vendor/bin/phpbench run --group=comparative --tag=head --ref=baseline --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/comparison.txt"
          # Compare only the hot paths affected by the latest optimization work.
          filter='ConnectionLifecycleBench|ConnectionBench|HandshakeBench|FrameCodecBench'
          export WEBSOCKET_BENCH_SOURCE="$RUNNER_TEMP/checkpoint/src"
          vendor/bin/phpbench run --group=comparative --filter="$filter" --tag=checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/checkpoint.txt"
          vendor/bin/phpbench run --group=checkpoint-runtime --tag=deadline_checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/deadline-checkpoint.txt"
          vendor/bin/phpbench run --group=network --tag=network_checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/network-checkpoint.txt"
          export WEBSOCKET_BENCH_SOURCE="$PWD/src"
          vendor/bin/phpbench run --group=checkpoint-runtime --tag=deadline_head --ref=deadline_checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/deadline-comparison.txt"
          vendor/bin/phpbench run --group=comparative --filter="$filter" --tag=checkpoint_head --ref=checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/checkpoint-comparison.txt"
          vendor/bin/phpbench run --group=runtime --tag=runtime --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/runtime.txt"
          vendor/bin/phpbench run --group=network --tag=network --ref=network_checkpoint --report=aggregate --no-ansi | tee "$RUNNER_TEMP/performance/network.txt"
          cp -r .phpbench/storage "$RUNNER_TEMP/performance/storage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpbench-php-${{ matrix.php }}
          path: ${{ runner.temp }}/performance
          if-no-files-found: error
